name: Build and Deploy to App Stores (prd)

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'app.config.ts'
      - 'eas.json'
      - 'google-services-prd.json'
      - 'GoogleService-Info-prd.plist'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        type: choice
        options:
          - all
          - ios
          - android
      version:
        description: 'Force marketing version X.Y.Z (leave empty to derive from conventional commits)'
        required: false
        type: string
        default: ''
      skip_version_bump:
        description: 'Build package.json as-is — for re-running a version the stores never accepted'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  detect-platform:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.detect.outputs.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            native:
              - 'yarn.lock'
              - 'app.config.ts'
              - 'eas.json'
            android:
              - 'google-services-prd.json'
            ios:
              - 'GoogleService-Info-prd.plist'
      # package.json changes for many reasons (scripts, devDeps) that don't need a
      # native rebuild — only treat it as build-worthy when the app `version` field
      # actually changes (a release). Dependency changes are covered by yarn.lock above.
      - id: version
        run: |
          BEFORE='${{ github.event.before }}'
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          OLD=$(git show "$BEFORE:package.json" 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('version',''))" 2>/dev/null || echo "")
          NEW=$(python3 -c "import json;print(json.load(open('package.json')).get('version',''))")
          echo "old=$OLD new=$NEW"
          # Only treat as a release when BOTH versions are readable AND differ.
          # On non-fast-forward pushes (rebase/squash) the `before` commit is
          # unreachable, so OLD is empty — that's "unknown", not "changed", and
          # must not force a full build.
          if [[ -n "$OLD" && "$OLD" != "$NEW" ]]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - id: detect
        run: |
          if [[ "${{ steps.changes.outputs.native }}" == "true" || "${{ steps.version.outputs.changed }}" == "true" ]]; then
            echo "platform=all" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changes.outputs.android }}" == "true" && "${{ steps.changes.outputs.ios }}" == "true" ]]; then
            echo "platform=all" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changes.outputs.android }}" == "true" ]]; then
            echo "platform=android" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changes.outputs.ios }}" == "true" ]]; then
            echo "platform=ios" >> "$GITHUB_OUTPUT"
          else
            echo "platform=none" >> "$GITHUB_OUTPUT"
          fi

  # Apple rejects a submission whose CFBundleShortVersionString was already used, so
  # a store release MUST carry a fresh marketing version. Bumping used to be a manual
  # `Release version` dispatch that nothing prompted you to run — miss it and Android
  # sails through (it gates on versionCode) while iOS rejects at submission, 40
  # minutes of build later. Resolve it here instead, so the automatic path can't ship
  # a stale version.
  #
  # The version is derived from main's commits (that's what's being built) but the
  # bump COMMIT lands on stg, preserving the stg-first rule that CI never commits to
  # main — it reaches main on the next normal merge. The build itself doesn't need
  # that commit: `eas build --local` builds the working tree, which the deploy jobs
  # stamp from this job's output.
  resolve-version:
    if: ${{ always() && !failure() && !cancelled() && (github.event_name == 'workflow_dispatch' || needs.detect-platform.outputs.platform != 'none') }}
    needs: [detect-platform]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the conventional-commit scan can see it
      - uses: actions/setup-node@v5
        with:
          node-version: '23'

      - id: resolve
        # Free-text dispatch inputs go through env, never interpolated into the shell
        # source — `${{ }}` is textual substitution and would execute anything quoted
        # into it.
        env:
          FORCED: ${{ inputs.version }}
          SKIP: ${{ inputs.skip_version_bump }}
        run: |
          set -euo pipefail
          if [[ "$SKIP" == "true" ]]; then
            echo "skip_version_bump — building package.json as-is"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$FORCED" ]]; then
            node scripts/next-version.mjs --set "$FORCED" | tee /tmp/version.json
          else
            node scripts/next-version.mjs | tee /tmp/version.json
          fi
          CURRENT=$(node -e 'console.log(require("/tmp/version.json").current)')
          NEXT=$(node -e 'console.log(require("/tmp/version.json").next)')
          # No releasable commits since the last version — nothing to bump. Build what
          # main already has; the stores decide whether they'll take it.
          if [[ "$NEXT" == "$CURRENT" ]]; then
            echo "no bump warranted (still $CURRENT)"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Version"
            echo '```json'
            cat /tmp/version.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Record the bump on stg so the next release computes from it. This runs BEFORE
      # the build on purpose: a version we can't record is a version we'd compute
      # again next time and resubmit — exactly the rejection this job exists to stop.
      - name: Record bump on stg
        if: ${{ steps.resolve.outputs.version != '' }}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin stg
            git checkout -B stg origin/stg
            CURRENT=$(node -e 'console.log(require("./package.json").version)')
            if [[ "$CURRENT" == "$VERSION" ]]; then
              echo "stg already at $VERSION — nothing to record"
              exit 0
            fi
            node scripts/next-version.mjs --set "$VERSION" --apply
            git commit -am "chore(release): v$VERSION [skip ci]"
            # ANNOTATED — `push --follow-tags` ignores lightweight tags. -f so a retry
            # after a rejected push can re-tag the rebuilt commit.
            git tag -f -a "v$VERSION" -m "v$VERSION"
            if git push origin stg --follow-tags; then
              echo "recorded v$VERSION on stg"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — stg moved, retrying"
            git reset --hard "origin/stg"
          done
          echo "::error::could not record v$VERSION on stg after 3 attempts — not building a version we can't track"
          exit 1

  deploy:
    needs: [detect-platform, resolve-version]
    # `always()` is here only to tolerate detect-platform being SKIPPED on dispatch —
    # it must not extend to resolve-version. A cancelled resolver (runner starvation
    # cancels jobs before they record a step) leaves `outputs.version` empty, which
    # the deploy jobs read as "build package.json as-is" — silently shipping the stale
    # version this whole job exists to prevent. `failure()`/`cancelled()` don't catch
    # it: a cancelled NEED is neither a workflow failure nor a workflow cancellation.
    # Require success explicitly.
    if: ${{ always() && !failure() && !cancelled() && needs.resolve-version.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.detect-platform.outputs.platform != 'none') }}
    uses: ./.github/workflows/expo-store-deploy.yml
    secrets: inherit
    with:
      environment: prd
      platform: ${{ github.event_name == 'push' && needs.detect-platform.outputs.platform || inputs.platform }}
      version: ${{ needs.resolve-version.outputs.version }}
