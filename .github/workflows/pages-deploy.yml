name: Deploy Pages

# Publishes docs/ to GitHub Pages (custom domain: reflects.sytes.net).
#
# Replaces the auto-generated "Deploy from a branch" pipeline, which was pinned
# to Node-20 actions (checkout@v4/upload-artifact@v4 → deprecation warnings) and
# re-deployed on EVERY push to main — even ones that never touched docs/. That
# caused queued deploys to pile up and either time out (deployment_queued) or get
# cancelled by the next push. Here we scope to docs/** and use the same @v5
# actions the rest of the repo standardised on.
#
# Still a full Jekyll build (github-pages gem): docs/*.md has no front matter but
# the gem's default plugins convert privacy-policy.md / terms-of-service.md to
# themed HTML, which the extensionless links in the app and stores rely on. A
# plain static upload would 404 those legally-required pages.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One production deploy at a time. Unlike the rest of the repo we do NOT cancel
# in-progress runs: a Pages deploy that's already publishing should finish rather
# than be interrupted mid-publish. Docs changes are infrequent, so no pileup.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # Jekyll on GitHub Pages will not publish /.well-known — verified twice against
      # the built artifact: `include: ['.well-known']` in _config.yml produced nothing,
      # and a page with `permalink: /.well-known/...` produced nothing either (the
      # source directory didn't even get copied as a static file). Both failed SILENTLY,
      # which is how assetlinks.json ended up at /android/ and then on another domain.
      #
      # Android reads ONLY /.well-known/assetlinks.json and iOS reads ONLY
      # /.well-known/apple-app-site-association, so copy them in after the build. This
      # is independent of Jekyll's dotfile handling; upload-pages-artifact tars `.`
      # and keeps dot-directories.
      - name: Publish /.well-known
        run: |
          set -euo pipefail
          # sudo: jekyll-build-pages runs in a container as a different uid, so _site
          # is not owned by the runner user and a plain mkdir gets EACCES.
          sudo mkdir -p ./_site/.well-known
          sudo cp ./docs/well-known/* ./_site/.well-known/
          # Readable by the artifact packer, which runs as the runner user.
          sudo chmod -R a+rX ./_site/.well-known
          echo "published:"
          ls -la ./_site/.well-known/
          # Fail loudly rather than deploying a site where app links silently break.
          node -e 'JSON.parse(require("fs").readFileSync("./_site/.well-known/assetlinks.json","utf8"))'
          echo "assetlinks.json is valid JSON"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # THE reason /.well-known has never been publishable from this repo: this
          # input defaults to false and drops every dot-directory from the artifact,
          # so the files vanish between a green build and the live site. Android and
          # iOS read app-link files from /.well-known and nowhere else.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub's Pages backend is intermittently slow to finish publishing;
          # the 10-minute default aborts a deployment that's still in_progress.
          # 20 minutes rides out the slow window instead of failing a good build.
          timeout: 1200000
