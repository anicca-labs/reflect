# Jekyll config for the GitHub Pages site (docs/).
#
# This file exists for ONE reason: Jekyll excludes dot-directories from its build
# by default, so `docs/.well-known/` would be silently dropped and never published.
# Digital Asset Links (Android) and Universal Links (iOS) BOTH require their files
# at exactly /.well-known/ — no other path is read. Without this include, the files
# are in the repo, look correct, and 404 in production with nothing to indicate why.
# That is what previously pushed assetlinks.json to /android/ (unread by Android)
# and then off to another domain entirely.
include:
  - .well-known
